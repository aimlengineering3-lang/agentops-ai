[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-ai"
version = "0.1.0"
description = "Autonomous research, analysis and decision intelligence agent platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

# Explicit package list: the repo will also contain api/, ui/, eval/, tests/.
# Without this, setuptools sees several top-level folders and refuses to build.
[tool.setuptools.packages.find]
include = ["agentops*", "api*", "ui*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CSS/HTML template strings read worse wrapped than long; not worth the E501 fight.
"ui/theme.py" = ["E501"]
"ui/components.py" = ["E501"]